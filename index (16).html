  function cellSVG(n, owned, lv){
    var s='<svg viewBox="0 0 100 100" aria-hidden="true">'+houseSVG(n, lv);
    if(owned && !(byNum[n]&&byNum[n].ab)) s+=residentSVG(n,2,36,0.5);
    return s+'</svg>';
  }

  function sceneSVG(n, owned, lv){
    var s='<svg viewBox="0 0 160 160" aria-hidden="true">';
    s+='<g transform="translate(16 18) scale(1.15)">'+houseSVG(n, lv)+'</g>';
    if(!owned) s+='<text x="80" y="140" text-anchor="middle" font-family="Poppins,sans-serif" font-weight="800" font-size="12" fill="#2e2448">à espera</text>';
    if(byNum[n]&&byNum[n].ab){s+='<text x="80" y="146" text-anchor="middle" font-family="Poppins,sans-serif" font-weight="800" font-size="12" fill="#6b5a48">abandonada</text>';return s+'</svg>';}
    var it_=itensDe(n);
    if(it_.indexOf('jardim')>=0){var fc=['#f06292','#ffd21f','#ffffff','#ba68c8','#ff8a65'];for(var fx=10,fi=0;fx<=150;fx+=14,fi++){if(fx>44&&fx<116)continue;s+='<line x1="'+fx+'" y1="156" x2="'+fx+'" y2="146" stroke="#4f9a4a" stroke-width="2"/><circle cx="'+fx+'" cy="144" r="4.5" fill="'+fc[fi%5]+'" stroke="#2e2448" stroke-width="1.2"/>';}}
    if(it_.indexOf('cerca')>=0){s+='<rect x="4" y="139" width="152" height="3" fill="#fff" stroke="#2e2448" stroke-width="1"/><rect x="4" y="149" width="152" height="3" fill="#fff" stroke="#2e2448" stroke-width="1"/>';for(var px=6;px<=150;px+=12){s+='<path d="M'+px+' 158 V136 L'+(px+3)+' 132 L'+(px+6)+' 136 V158 Z" fill="#fff" stroke="#2e2448" stroke-width="1.2"/>';}}
    var IM=window.CZ_IMG||{},sp=itensDe(n).filter(function(k){return SPR[k]&&IM[SPR[k]]}).slice(0,5),x0=(160-sp.length*32)/2;
    sp.forEach(function(k,i){s+='<image href="'+IM[SPR[k]][0]+'" x="'+(x0+i*32+2)+'" y="124" width="28" height="30" preserveAspectRatio="xMidYMax meet"/>'});

    return s+'</svg>';
  }

  function pad(n){return ('000'+n).slice(-3)}
  var $=function(id){return document.getElementById(id)};
  var sel=0;

  function norm(s){return String(s||'').toLowerCase().replace(/^@+/,'').replace(/\s+/g,'')}

  var CURRENT_EP = 2, MAXLV = 5, PROFS = [];
  function level(p){ return p ? Math.max(1, Math.min(MAXLV, CURRENT_EP - p.ep + 1)) : 1; }

    chef:'<path d="M6 16h12v4H6z M7 16c-3 0-4-4-1-5 0-3 4-4 6-2 2-2 6-1 6 2 3 1 2 5-1 5z"/>',

    livro:'<path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"/>',
    fogo:'<path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 3-7 1 1 2 2 3 2 0-3-1-4 0-7z"/>',
    folha:'<path d="M5 19C4 9 10 4 20 4c0 10-5 16-13 16 2-4 4-7 7-9-4 1-7 4-9 8z"/>',
    paleta:'<path d="M12 3a9 9 0 1 0 0 18c2 0 2-2 1-3-1-2 0-3 2-3h3a3 3 0 0 0 3-3c0-5-4-9-9-9z"/>',

    pao:'<path d="M4 12c0-4 4-7 8-7s8 3 8 7c0 1-1 2-2 2v5H6v-5c-1 0-2-1-2-2z"/>',
    estrela:'<path d="M12 2l3 7 7 1-5 5 2 7-7-4-7 4 2-7-5-5 7-1z"/>'
  };
  function profIcon(k){ return '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">'+(ICONS[k]||ICONS.estrela)+'</svg>'; }
  function profByName(nm){ for(var i=0;i<PROFS.length;i++) if(PROFS[i].nome===nm) return PROFS[i]; return null; }
  function stars(lv){ var s=''; for(var i=1;i<=MAXLV;i++) s+='<span class="pip'+(i<=lv?' on':'')+'"></span>'; return '<span class="pips" aria-hidden="true">'+s+'</span>'; }

  function showPanel(n){

      h+='<button type="button" class="cell '+(p?'own':'free')+'" data-n="'+n+'" aria-label="Casa '+n+(p?', @'+p.h+(p.p?'…':''):', ainda sem dono revelado')+'">'+cellSVG(n,!!p,level(p))+'<span>'+pad(n)+'</span></button>';

  }

  function search(){
    var q=norm($('busca').value), sg=$('sugs'); sg.innerHTML='';

    var exact=hits.filter(function(p){return norm(p.h)===q})[0];
    if(exact){showPanel(exact.n);return}
    if(hits.length){
      hits.slice(0,6).forEach(function(p){var b=document.createElement('button');b.type='button';b.className='chip';b.textContent='@'+p.h+(p.p?'…':'');b.onclick=function(){$('busca').value=p.h;showPanel(p.n);sg.innerHTML=''};sg.appendChild(b)});
    } else {
      var d=document.createElement('span');d.className='count';d.textContent='Não achamos esse usuário. Confira se você já segue @cidadezero.oficial, ou procure só o começo do @.';sg.appendChild(d);
    }
  }

  function fromHash(){var m=/^#casa-(\d{1,4})$/.exec(location.hash); if(m){var n=+m[1]; if(n>=1&&n<=TOTAL){showPanel(n);return true}} return false}

  function init(data){
    var list=data.moradores||[]; CURRENT_EP=data.episodio_atual||2; PROFS=data.profissoes||[];
    people=list; byNum={}; list.forEach(function(p){byNum[p.n]=p; if(p.n>TOTAL) TOTAL=p.n});
    $('tot').textContent=TOTAL;
    build();
    if(!fromHash()) showEmpty();
    $('busca').addEventListener('input',search);
    window.addEventListener('hashchange',fromHash);
  }

})();

  LOJA.map(([k, ic, n, p, d]) => '<div class="loja ' + k + '"><i>' + ic + '</i><div><b>' + n + '</b><small>' + d + '</small></div><button class="btn mini" data-a="comprar" data-t="' + k + '"' + (CONTA.moedas < p ? ' disabled' : '') + '>🪙 ' + p + '</button></div>').join('') +
  '<h4>🌟 Moradores lendários desta temporada</h4><div class="lendas">' + Object.keys(CARTAS).filter(c => CARTAS[c].rar === 'lendaria').map(c => '<div data-a="verCarta" data-c="' + c + '"><canvas data-c="' + c + '" width="120" height="150"></canvas><small>' + esc(CARTAS[c].nome) + '</small></div>').join('') + '</div></div>';
  ov.querySelectorAll('canvas').forEach(c => c.getContext('2d').drawImage(arteCarta(c.dataset.c), 0, 0)); }
async function comprar(t){ try { som('clique'); const r = await rpc('arena_comprar', {p_tipo:t}); r.antes = new Set(Object.keys(JOG.cartas)); JOG.cartas = r.cartas; CONTA.moedas = r.moedas_conta; mostraBau(r); atualizaSaldo(); } catch (e){ som('erro'); aviso(e.message); } }
function atualizaSaldo(){ const e = $('hMoe'); if (e) e.textContent = CONTA.moedas; }

})();</script>
